<div class="p-2 md:p-2 h-full flex flex-col">
  <!-- Header Row with Breadcrumb -->
  <div class="flex flex-row justify-between items-center mb-2 md:mb-3 gap-2 min-h-0">
    <!-- Dynamic Breadcrumb -->
    <div class="flex items-center">
      <app-breadcrumb
        [currentPage]="'dashboard'"
        (navigate)="onBreadcrumbNavigate($event)"
      ></app-breadcrumb>
    </div>
  </div>

  <!-- Welcome Card Container -->
  <div class="h-screen flex items-center justify-center overflow-hidden">
    <div class="bg-white border border-red-300 rounded-2xl shadow-2xl p-12 w-96 sm:w-112 text-center transform hover:scale-105 transition-transform duration-300">
      <h2 class="text-2xl sm:text-3xl font-bold text-blue-900 mb-4 flex justify-center">
        <img
          src="assets/logo-shine-neha-surgical.gif"
          alt="Neha Surgical Logo"
          class="h-40 sm:h-48 object-contain"
        />
      </h2>
      <p class="text-blue-800 text-lg sm:text-xl">
        {{ isFirstTimeLogin ? 'Welcome!' : 'Welcome back!' }}<br />
      </p>
    </div>
  </div>
</div>
