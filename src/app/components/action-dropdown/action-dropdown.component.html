<div class="relative">
  <!-- Dropdown Button -->
  <button
    (click)="toggleDropdown()"
    class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors duration-200"
  >
    <span>Actions</span>
    <svg 
      class="w-4 h-4 ml-2 transition-transform duration-200"
      [class.rotate-180]="isOpen"
      fill="none" 
      stroke="currentColor" 
      viewBox="0 0 24 24"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Dropdown Menu -->
  <div
    *ngIf="isOpen"
    class="absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-lg border border-gray-200 z-50 overflow-hidden"
  >
    <ng-container *ngFor="let group of actions; let groupIndex = index">
      <!-- Divider between groups -->
      <div *ngIf="groupIndex > 0" class="border-t border-gray-200"></div>
      
      <div class="py-1">
        <button
          *ngFor="let action of group"
          (click)="handleAction(action)"
          [disabled]="action.disabled"
          class="w-full flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors duration-150"
          [class.opacity-50]="action.disabled"
          [class.cursor-not-allowed]="action.disabled"
        >
          <!-- Icon based on action type -->
          <span class="w-5 h-5 mr-3 flex items-center justify-center">
            <!-- Add Icon -->
            <svg *ngIf="action.icon === 'add'" class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <!-- Refresh Icon -->
            <svg *ngIf="action.icon === 'refresh'" class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            <!-- Export Icon -->
            <svg *ngIf="action.icon === 'export'" class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <!-- Delete Icon -->
            <svg *ngIf="action.icon === 'delete'" class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            <!-- Import Icon -->
            <svg *ngIf="action.icon === 'import'" class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
          </span>
          
          <span class="flex-1 text-left">{{ action.label }}</span>
          
          <!-- Badge -->
          <span 
            *ngIf="action.badge" 
            class="ml-2 px-2 py-0.5 text-xs font-medium bg-gray-200 text-gray-600 rounded-full"
          >
            {{ action.badge }}
          </span>
        </button>
      </div>
    </ng-container>
  </div>
</div>
