<!-- Mobile Backdrop -->
<div
  *ngIf="isOpen"
  class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"
  (click)="onBackdropClick()"
></div>

<!-- Sidebar -->
<div
  class="fixed lg:relative top-0 left-0 h-screen bg-blue-900 shadow-xl z-50 lg:z-auto transform transition-transform duration-300 ease-in-out w-64 flex flex-col"
  [ngClass]="{
    'translate-x-0': isOpen,
    '-translate-x-full lg:translate-x-0': !isOpen
  }"
>
  <!-- Header -->
  <div
    class="flex items-center justify-between px-4 py-4 border-b border-blue-700/50 flex-shrink-0 shadow-lg"
    style="background-color: #1e3a8a"
  >
    <h2 class="text-base font-bold text-white tracking-wide">MENU LIST</h2>
    <!-- Close button for mobile -->
    <button
      (click)="onBackdropClick()"
      class="lg:hidden p-1.5 text-white hover:bg-blue-800 rounded-lg transition-all duration-200 hover:scale-110"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto p-2">
    <ul class="space-y-2">
      <li *ngFor="let item of filteredMenuItems">
        <!-- Menu Item Button -->
        <button
          (click)="item.submenu.length > 0 ? toggleSubmenu(item.key) : handleMenuClick(item.key)"
          class="w-full flex items-center justify-between px-2 py-3 text-left text-blue-100 hover:bg-[#E31E25] hover:text-white rounded-lg transition-all duration-200 group shadow-sm hover:shadow-md hover:translate-x-1"
          [class.bg-[#E31E25]]="isMenuActive(item.key)"
          [class.text-white]="isMenuActive(item.key)"
          [class.shadow-md]="isMenuActive(item.key)"
        >
          <div class="flex items-center space-x-2">
            <!-- Icons using SVG -->
            <ng-container [ngSwitch]="item.icon">
              <!-- Home -->
              <svg *ngSwitchCase="'home'" class="w-5 h-5 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(item.key)" [class.text-white]="isMenuActive(item.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
              </svg>
              <!-- Database -->
              <svg *ngSwitchCase="'database'" class="w-5 h-5 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(item.key)" [class.text-white]="isMenuActive(item.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
              </svg>
              <!-- Shopping Cart -->
              <svg *ngSwitchCase="'shopping-cart'" class="w-5 h-5 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(item.key)" [class.text-white]="isMenuActive(item.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
              </svg>
              <!-- Folder Tree -->
              <svg *ngSwitchCase="'folder-tree'" class="w-5 h-5 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(item.key)" [class.text-white]="isMenuActive(item.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
              </svg>
              <!-- Arrows Exchange -->
              <svg *ngSwitchCase="'arrows-exchange'" class="w-5 h-5 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(item.key)" [class.text-white]="isMenuActive(item.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
              </svg>
              <!-- Clipboard -->
              <svg *ngSwitchCase="'clipboard'" class="w-5 h-5 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(item.key)" [class.text-white]="isMenuActive(item.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
              </svg>
              <!-- Receipt -->
              <svg *ngSwitchCase="'receipt'" class="w-5 h-5 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(item.key)" [class.text-white]="isMenuActive(item.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2z" />
              </svg>
              <!-- Money Bill -->
              <svg *ngSwitchCase="'money-bill'" class="w-5 h-5 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(item.key)" [class.text-white]="isMenuActive(item.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
              </svg>
              <!-- Chart Pie -->
              <svg *ngSwitchCase="'chart-pie'" class="w-5 h-5 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(item.key)" [class.text-white]="isMenuActive(item.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" />
              </svg>
              <!-- Default -->
              <svg *ngSwitchDefault class="w-5 h-5 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(item.key)" [class.text-white]="isMenuActive(item.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </ng-container>
            <span class="font-semibold text-sm tracking-wide">{{ item.label }}</span>
          </div>
          <!-- Chevron for submenu -->
          <svg
            *ngIf="item.submenu.length > 0"
            class="w-4 h-4 text-white transform transition-all duration-200"
            [ngClass]="{ 'rotate-90': isSubmenuOpen(item.key) }"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>

        <!-- Submenu -->
        <ul
          *ngIf="isSubmenuOpen(item.key) && item.submenu.length > 0"
          class="ml-2 mt-1.5 space-y-1 border-l-2 border-blue-700/30 pl-3"
        >
          <li *ngFor="let subItem of item.submenu">
            <button
              (click)="handleMenuClick(subItem.key)"
              class="w-full flex items-center space-x-2 px-2 py-2.5 text-left text-blue-200 hover:bg-[#E31E25] hover:text-white rounded-lg transition-all duration-200 text-sm group hover:translate-x-1 hover:shadow-sm"
              [class.bg-[#E31E25]]="isMenuActive(subItem.key)"
              [class.text-white]="isMenuActive(subItem.key)"
              [class.font-semibold]="isMenuActive(subItem.key)"
            >
              <!-- Submenu Icons -->
              <ng-container [ngSwitch]="subItem.icon">
                <!-- Sitemap -->
                <svg *ngSwitchCase="'sitemap'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zM14 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
                </svg>
                <!-- User Nurse / Doctor -->
                <svg *ngSwitchCase="'user-nurse'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <!-- Hospital -->
                <svg *ngSwitchCase="'hospital'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
                <!-- Tag / Brand -->
                <svg *ngSwitchCase="'tag'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                </svg>
                <!-- List / Specification -->
                <svg *ngSwitchCase="'list'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                </svg>
                <!-- Ruler / Size -->
                <svg *ngSwitchCase="'ruler'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
                <!-- Folder / Category -->
                <svg *ngSwitchCase="'folder'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                </svg>
                <!-- Boxes / Item Group -->
                <svg *ngSwitchCase="'boxes'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v4m6-4v4" />
                </svg>
                <!-- Users -->
                <svg *ngSwitchCase="'users'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <!-- Shield / Role -->
                <svg *ngSwitchCase="'shield'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
                <!-- Bars / Menu -->
                <svg *ngSwitchCase="'bars'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <!-- Plus Circle / Order Entry -->
                <svg *ngSwitchCase="'plus-circle'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <!-- Clock / Upcoming -->
                <svg *ngSwitchCase="'clock'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <!-- Handshake -->
                <svg *ngSwitchCase="'handshake'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11" />
                </svg>
                <!-- Truck -->
                <svg *ngSwitchCase="'truck'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0" />
                </svg>
                <!-- Shipping Fast / Delivery -->
                <svg *ngSwitchCase="'shipping-fast'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M3 5h4M3 9h2m6 8a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0" />
                </svg>
                <!-- Hospital User -->
                <svg *ngSwitchCase="'hospital-user'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M12 7v6m-3-3h6" />
                </svg>
                <!-- File Invoice -->
                <svg *ngSwitchCase="'file-invoice'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <!-- Hand Holding Dollar -->
                <svg *ngSwitchCase="'hand-holding-dollar'" class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <!-- Default -->
                <svg *ngSwitchDefault class="w-4 h-4 group-hover:text-white transition-colors duration-200" [class.text-[#E31E25]]="!isMenuActive(subItem.key)" [class.text-white]="isMenuActive(subItem.key)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
              </ng-container>
              <span class="tracking-wide">{{ subItem.label }}</span>
            </button>
          </li>
        </ul>
      </li>
    </ul>
  </nav>
</div>
