<nav class="flex mb-2" aria-label="Breadcrumb">
  <ol class="inline-flex items-center space-x-0.5 md:space-x-1.5">
    <li 
      *ngFor="let item of breadcrumbItems; let i = index; let last = last"
      [class]="last ? 'inline-flex items-center' : ''"
      [attr.aria-current]="last ? 'page' : null"
    >
      <div class="flex items-center">
        <!-- Separator -->
        <svg 
          *ngIf="i > 0" 
          class="w-2.5 h-2.5 text-gray-400 mx-0.5" 
          fill="none" 
          viewBox="0 0 6 10"
        >
          <path 
            stroke="currentColor" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            stroke-width="2" 
            d="m1 9 4-4-4-4"
          />
        </svg>
        
        <!-- Clickable Item -->
        <button
          *ngIf="isClickable(i)"
          (click)="handleNavigate(item.key)"
          [class]="i === 0 
            ? 'inline-flex items-center text-xs font-medium text-blue-700 hover:text-blue-800 focus:outline-none focus:text-blue-800 transition-colors' 
            : 'ml-0.5 md:ml-1 text-xs font-medium text-blue-700 hover:text-blue-800 focus:outline-none focus:text-blue-800 transition-colors'"
        >
          <!-- Home Icon -->
          <svg 
            *ngIf="item.icon === 'home'" 
            class="w-3 h-3 mr-2.5" 
            fill="currentColor" 
            viewBox="0 0 20 20"
          >
            <path d="m19.707 9.293-2-2-7-7a1 1 0 0 0-1.414 0l-7 7-2 2a1 1 0 0 0 1.414 1.414L2 10.414V18a2 2 0 0 0 2 2h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a2 2 0 0 0 2-2v-7.586l.293.293a1 1 0 0 0 1.414-1.414Z"/>
          </svg>
          {{ item.label }}
        </button>
        
        <!-- Non-clickable Item (Last) -->
        <span
          *ngIf="!isClickable(i)"
          [class]="i === 0 
            ? 'inline-flex items-center text-xs font-medium ' + (last ? 'text-blue-500' : 'text-blue-700')
            : 'ml-0.5 md:ml-1 text-xs font-medium ' + (last ? 'text-blue-500' : 'text-blue-700')"
        >
          <!-- Home Icon -->
          <svg 
            *ngIf="item.icon === 'home'" 
            class="w-3 h-3 mr-2.5" 
            fill="currentColor" 
            viewBox="0 0 20 20"
          >
            <path d="m19.707 9.293-2-2-7-7a1 1 0 0 0-1.414 0l-7 7-2 2a1 1 0 0 0 1.414 1.414L2 10.414V18a2 2 0 0 0 2 2h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a2 2 0 0 0 2-2v-7.586l.293.293a1 1 0 0 0 1.414-1.414Z"/>
          </svg>
          {{ item.label }}
        </span>
      </div>
    </li>
  </ol>
</nav>
